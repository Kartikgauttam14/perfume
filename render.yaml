services:
  - type: web
    name: mansam-rag-concierge
    env: python
    region: frankfurt # or oregon / ohio / singapore
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false # Set securely in Render dashboard
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: CHUNKS_FILE_PATH
        value: ./mansam_chunks.jsonl
      - key: SUMMARY_FILE_PATH
        value: ./mansam_chunks_summary.json
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "False"
